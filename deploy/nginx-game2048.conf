# ============================================================
#  2048 — nginx + HTTPS örnek yapılandırması
#
#  Amaç: site VE API tamamen HTTPS üzerinden; HTTP'ye gireni HTTPS'e kalıcı
#  yönlendir; HSTS ile tarayıcıyı HTTPS'e kilitle. Frontend ve API AYNI ORIGIN
#  altında ( /emre/2048/  ve  /emre/2048/api/ ) → istemci kodu same-origin göreli
#  yol kullanır, sabit IP/protokol yoktur, karışık içerik oluşmaz.
#
#  <ALANADI> yerine gerçek alan adınızı yazın. Sertifikayı certbot kurar
#  (bkz. README "Dağıtım / HTTPS"). Bu dosya /etc/nginx/sites-available/ altına
#  konup sites-enabled'a linklenir.
# ============================================================

# --- HTTP (80): ACME doğrulaması hariç HER ŞEYİ HTTPS'e yönlendir ---
server {
    listen 80;
    listen [::]:80;
    server_name <ALANADI>;

    # Let's Encrypt HTTP-01 doğrulaması (yenilemede gerekir)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Diğer her istek → kalıcı HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name <ALANADI>;

    ssl_certificate     /etc/letsencrypt/live/<ALANADI>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<ALANADI>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS: tarayıcı bu siteyi bir yıl boyunca yalnızca HTTPS ile açar.
    # (includeSubDomains'i yalnızca TÜM alt alanlar HTTPS ise açın; preload
    #  listesine ekleyecekseniz preload'ı da ekleyin.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Ek güvenlik başlıkları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- 2048 API → yerel Python servisi (aynı origin altında) ---
    # /emre/2048/api/register → http://127.0.0.1:8092/register (öneki soyulur)
    location /emre/2048/api/ {
        proxy_pass http://127.0.0.1:8092/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 2048 SPA (Angular) — /var/www/emre/2048/ ---
    location /emre/2048/ {
        alias /var/www/emre/2048/;
        try_files $uri $uri/ /emre/2048/index.html;
    }

    # (Diğer uygulamalar; ör. /emre/ havaalanı oyunu buraya eklenir.)
}

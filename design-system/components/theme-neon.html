<!-- @dsCard group="Temalar" -->
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tema · Neon</title>
    <style>
      :root { --bg:#0d0221; --board:#241b4a; --cell:#2f2560; --text:#e6e1ff; --text-light:#ffffff; --button:#7b2ff7;
        --font:'Clear Sans','Helvetica Neue',Arial,sans-serif; }
      * { box-sizing: border-box; }
      body { margin:0; font-family:var(--font); background:var(--bg); color:var(--text); padding:26px; }
      h1 { font-size:15px; letter-spacing:0.04em; text-transform:uppercase; margin:0 0 2px; }
      p.sub { margin:0 0 20px; opacity:0.7; font-size:13px; }
      .board { display:grid; grid-template-columns:repeat(2,58px); grid-template-rows:repeat(2,58px);
        gap:10px; padding:10px; background:var(--board); border-radius:10px; width:max-content; }
      .tile { border-radius:6px; display:grid; place-items:center; font-weight:800; font-size:22px; }
      .empty { background:var(--cell); }
      .foot { display:flex; align-items:center; gap:14px; margin-top:18px; }
      .btn { background:var(--button); color:var(--text-light); font-weight:700; font-size:15px;
        padding:11px 20px; border:none; border-radius:6px; min-height:44px; box-shadow:0 0 16px rgba(123,47,247,0.6); }
      .swatches { display:flex; gap:6px; margin-top:16px; }
      .swatches span { width:30px; height:30px; border-radius:6px; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14); }
    </style>
  </head>
  <body>
    <h1>🎨 Neon tema</h1>
    <p class="sub">Mağaza · 200 altın</p>
    <div class="board">
      <div class="tile" style="background:#eee4da;color:#776e65">2</div>
      <div class="tile" style="background:#f67c5f;color:#f9f6f2">32</div>
      <div class="tile empty"></div>
      <div class="tile" style="background:#edc850;color:#f9f6f2">512</div>
    </div>
    <div class="foot">
      <button class="btn">Yeni Oyun</button>
      <span style="opacity:0.7;font-size:13px">Skor <b style="font-size:18px">2100</b></span>
    </div>
    <div class="swatches">
      <span style="background:#0d0221"></span><span style="background:#241b4a"></span>
      <span style="background:#2f2560"></span><span style="background:#7b2ff7"></span>
      <span style="background:#00e5ff"></span>
    </div>
  </body>
</html>

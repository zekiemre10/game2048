<!-- @dsCard group="Temalar" -->
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Temalar · genel bakış</title>
    <style>
      :root { --font: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); background: #1a1917; color: #ece3d8; padding: 28px; }
      h1 { font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 4px; opacity: 0.75; }
      p.sub { margin: 0 0 22px; opacity: 0.6; font-size: 13px; }
      .theme { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.08); }
      .name { width: 120px; font-weight: 700; font-size: 14px; }
      .name small { display: block; opacity: 0.55; font-weight: 400; font-size: 11px; }
      .pal { display: flex; gap: 6px; }
      .pal span { width: 34px; height: 34px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
    </style>
  </head>
  <body>
    <h1>Temalar — oyunun ana görsel kimliği</h1>
    <p class="sub">6 tema; kare paleti hepsinde sabit, değişen "çerçeve" (zemin/tahta/buton). 4'ü mağazadan altınla açılır.</p>

    <div class="theme"><div class="name">Açık<small>ücretsiz</small></div><div class="pal">
      <span style="background:#faf8ef"></span><span style="background:#bbada0"></span><span style="background:#cdc1b4"></span><span style="background:#8f7a66"></span><span style="background:#776e65"></span></div></div>
    <div class="theme"><div class="name">Koyu<small>ücretsiz</small></div><div class="pal">
      <span style="background:#1a1917"></span><span style="background:#3b3733"></span><span style="background:#4c4741"></span><span style="background:#a08d78"></span><span style="background:#ece3d8"></span></div></div>
    <div class="theme"><div class="name">Neon<small>200 altın</small></div><div class="pal">
      <span style="background:#0d0221"></span><span style="background:#241b4a"></span><span style="background:#2f2560"></span><span style="background:#7b2ff7"></span><span style="background:#00e5ff"></span></div></div>
    <div class="theme"><div class="name">Okyanus<small>300 altın</small></div><div class="pal">
      <span style="background:#0a2540"></span><span style="background:#14507a"></span><span style="background:#1d6ca3"></span><span style="background:#1e88c7"></span><span style="background:#48cae4"></span></div></div>
    <div class="theme"><div class="name">Orman<small>250 altın</small></div><div class="pal">
      <span style="background:#e9f5e1"></span><span style="background:#6a8f5f"></span><span style="background:#86a878"></span><span style="background:#4e8a45"></span><span style="background:#8bc34a"></span></div></div>
    <div class="theme"><div class="name">Gün Batımı<small>200 altın</small></div><div class="pal">
      <span style="background:#2a1a2e"></span><span style="background:#7a3b5a"></span><span style="background:#9a4f6e"></span><span style="background:#e8623a"></span><span style="background:#f9c74f"></span></div></div>
  </body>
</html>

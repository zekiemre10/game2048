<!-- @dsCard group="Tipografi" -->
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tipografi</title>
    <style>
      :root { --font: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--font); background: #faf8ef; color: #776e65; padding: 28px; }
      h1 { font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 4px; opacity: 0.75; }
      p.sub { margin: 0 0 24px; opacity: 0.65; font-size: 13px; }
      .spec { border-top: 1px solid rgba(0,0,0,0.08); padding: 14px 0; display: flex; align-items: baseline; gap: 18px; }
      .spec code { flex-shrink: 0; width: 150px; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; opacity: 0.65; }
      .sample { font-weight: 800; }
    </style>
  </head>
  <body>
    <h1>Tipografi</h1>
    <p class="sub">Tek aile: <code>'Clear Sans', 'Helvetica Neue', Arial, sans-serif</code>. Başlık/skor kalın (800); butonlar 700.</p>

    <div class="spec"><code>marka / logo · 800</code><span class="sample" style="font-size:40px">2048</span></div>
    <div class="spec"><code>skor · 800</code><span class="sample" style="font-size:28px">2100</span></div>
    <div class="spec"><code>overlay başlık · 800</code><span class="sample" style="font-size:24px">Seviye 2 Tamamlandı!</span></div>
    <div class="spec"><code>kare · 800</code><span class="sample" style="font-size:22px">512</span></div>
    <div class="spec"><code>buton · 700</code><span class="sample" style="font-size:17px;font-weight:700">Yeni Oyun</span></div>
    <div class="spec"><code>gövde · 400</code><span style="font-size:15px;font-weight:400">Hedefe en az hamlede ulaş.</span></div>
    <div class="spec"><code>etiket · 600 · caps</code><span style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em">Güçlerin</span></div>
  </body>
</html>

# ============================================================
#  2048 — nginx yapılandırması (proxy yolu + başlıklar + boyut sınırı)
#
#  ⚠️ PAYLAŞIMLI DOSYA: Bu makinede üç oyun sitesi TEK nginx dosyasında
#  (/etc/nginx/sites-available/cinar). Bu dosya bir REFERANS'tır — doğrudan ayrı
#  vhost açmak yerine, aşağıdaki location bloklarını paylaşımlı sunucu bloğuna
#  GÜVENLİ desenle ekleyin (bkz. deploy/README.md ve Kelimebaz nginx_add_rooms.py):
#    tarihli yedek → düzenle → `nginx -t` → başarısızsa geri yükle → `reload`.
#  Yanlış düzenleme üç siteyi birden düşürür.
#
#  Frontend statikleri /var/www/emre/2048/ altında; bu bloklar onunla AYNI
#  server { } içine konur. HTTPS ise ayrı bir pakette (bkz. HTTPS paketi).
# ============================================================

# --- 2048 API → yerel Python servisi (127.0.0.1:8092) ---
# /emre/2048/api/register → http://127.0.0.1:8092/register (önek soyulur)
location /emre/2048/api/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Uç-nokta hız sınırları GERÇEK istemci IP'sine baksın (app.py _ip()):
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # HTTPS eklenince backend'in isteği https bilmesi için (aksi hâlde http sanar):
    proxy_set_header X-Forwarded-Proto $scheme;

    # Gövde boyut sınırı — app.py MAX_BODY 256KB; nginx tarafında da sınırla
    # (büyük gövdeyle bellek/DoS). Küçük bir tampon bırak.
    client_max_body_size 512k;

    # Zaman aşımları (uzun süren istek yok; makul tut).
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

# --- (İsteğe bağlı) IP bazlı kaba istek sınırı — nginx seviyesinde ---
# http { } bloğunda tanımlanır (server bloğunda değil):
#   limit_req_zone $binary_remote_addr zone=game2048:10m rate=10r/s;
# Sonra yukarıdaki location içine:
#   limit_req zone=game2048 burst=20 nodelay;

# --- 2048 SPA (Angular) — statik dosyalar ---
location /emre/2048/ {
    alias /var/www/emre/2048/;
    try_files $uri $uri/ /emre/2048/index.html;
}

<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>2048 — Sayı Birleştirme Bulmacası</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      SEO / paylaşım — VARSAYILAN (tr). Aktif dile göre başlık, açıklama ve OG
      etiketleri çalışma zamanında SeoService ile güncellenir (sekme başlığı +
      JS çalıştıran tarayıcılar). JS çalıştırmayan sosyal kazıyıcılar buradaki
      varsayılanı görür; İngilizce link için ?lang=en (hreflang aşağıda).
    -->
    <meta
      name="description"
      content="Klasik 2048 bulmacası: kareleri kaydır, aynı sayıları birleştir ve 2048'e ulaş. Seviyeler, günlük meydan okuma, çok oyunculu yarış ve YZ rakipler — ücretsiz, TR/EN."
    />
    <meta name="author" content="emre" />

    <!-- Tarayıcı arayüz rengi (açık/koyu temaya göre) -->
    <meta name="theme-color" content="#faf8ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1917" media="(prefers-color-scheme: dark)" />

    <!-- Kanonik + dil alternatifleri (hreflang; ?lang= ile taşınır) -->
    <link rel="canonical" href="https://2048.aicirkit.com/" />
    <link rel="alternate" hreflang="tr" href="https://2048.aicirkit.com/?lang=tr" />
    <link rel="alternate" hreflang="en" href="https://2048.aicirkit.com/?lang=en" />
    <link rel="alternate" hreflang="x-default" href="https://2048.aicirkit.com/" />

    <!-- Open Graph (paylaşım önizlemesi) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="2048" />
    <meta property="og:title" content="2048 — Sayı Birleştirme Bulmacası" />
    <meta
      property="og:description"
      content="Kareleri kaydır, aynı sayıları birleştir, 2048'e ulaş! Seviyeler · günlük meydan okuma · çok oyunculu · YZ rakipler."
    />
    <meta property="og:url" content="https://2048.aicirkit.com/" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:image" content="https://2048.aicirkit.com/og-image.png" />
    <meta property="og:image:width" content="2560" />
    <meta property="og:image:height" content="1600" />
    <meta property="og:image:alt" content="2048 oyun ekranı" />

    <!-- Twitter kartı -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="2048 — Sayı Birleştirme Bulmacası" />
    <meta
      name="twitter:description"
      content="Kareleri kaydır, aynı sayıları birleştir, 2048'e ulaş!"
    />
    <meta name="twitter:image" content="https://2048.aicirkit.com/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!--
    Tema erken uygulanır (FOUC önleme): Angular yüklenmeden önce
    <html data-theme> ayarlanır, böylece koyu temada beyaz ekran parlamaz.
    ThemeService aynı anahtarı/kuralı kullanır.
  -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('game2048.theme');
          if (saved) {
            document.documentElement.setAttribute('data-theme', saved);
          } else {
            var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
